<!doctype html><html lang="es"><meta charset="utf-8"><meta name="description" content="Galería interna de revisión de esquemas"><title>Revisión de ilustraciones</title><style>
body{background:#0b101c;color:#d8e5f5;font:14px system-ui;margin:20px}nav{display:flex;gap:12px;margin-bottom:20px}button{font:inherit;padding:12px;border-radius:10px;border:1px solid #657a94;background:#1a2a40;color:white}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}article{border:1px solid #42536d;border-radius:12px;padding:10px}svg{width:100%;height:220px}h2{font-size:14px;margin:5px}p{font-size:12px;color:#9fb4d1}
</style><nav><button onclick="show(0)">Posturas 1</button><button onclick="show(1)">Posturas 2</button><button onclick="show(2)">Posturas 3</button><button onclick="show(3)">Posturas 4</button><button onclick="show(4)">Posturas 5</button></nav><main id="gallery"></main><script src="../../assets/js/exercise-illustrations.js"></script><script>
const tools={squat:'barbell',goblet:'dumbbell',lunge:'dumbbell',deadlift:'barbell',rdl:'kettlebell',single_rdl:'dumbbell',bridge:'dumbbell',hip_thrust:'barbell',leg_press:'machine',leg_extension:'machine',leg_curl:'machine',bench_press:'barbell',incline_press:'dumbbell',floor_press:'kettlebell',fly:'dumbbell',floor_fly:'dumbbell',chest_machine:'machine',overhead_press:'kettlebell',kneeling_press:'kettlebell',arnold:'dumbbell',raise:'dumbbell',reverse_fly:'dumbbell',triceps_extension:'dumbbell',triceps_pushdown:'machine',pulldown:'machine',row:'dumbbell',chest_row:'machine',cable_row:'band',face_pull:'band',pullover:'dumbbell',curl:'barbell',towel_curl:'towel',swing:'kettlebell',clean_press:'kettlebell',halo:'kettlebell',carry:'dumbbell',wall_ball:'ball'};
function show(page){document.getElementById('gallery').innerHTML=exerciseIllustrationPoseKeys().slice(page*18,page*18+18).map(pose=>'<article><h2>'+pose+'</h2>'+exerciseIllustrationHtml({pose,tool:tools[pose]||'bodyweight',label:pose,support:true})+'<p>'+(tools[pose]||'bodyweight')+'</p></article>').join('');}show(0);
</script></html>
